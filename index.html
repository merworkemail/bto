<!doctype html><!--shell-->
<html lang="en"><!--shell-->
<head><!--shell-->
<meta charset="utf-8"><!--shell-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><!--shell-->
<title>Blk 74A Reno Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D stage; floating chrome — brand (TL), view controls (TC), history + budget (TR),
   tool rail + one slide-out drawer (L), contextual selection bar (B), plan inset that swaps with 3D (BR). */
:root {
  --stage: #e8ebe7;
  --ground: #dcdfda;
  --surface: #ffffff;
  --surface-2: #f3f5f2;
  --ink: #17201c;
  --muted: #66716b;
  --line: #e3e7e2;
  --line-strong: #cfd5ce;
  --accent: #0f6e5e;
  --accent-weak: #e2f0eb;
  --on-accent: #ffffff;
  --shadow: 0 1px 2px rgba(18, 28, 24, .06), 0 10px 28px rgba(18, 28, 24, .12);
  --shadow-sm: 0 1px 2px rgba(18, 28, 24, .08), 0 4px 12px rgba(18, 28, 24, .08);
  /* plan drawing */
  --paper: #fbfbf8;
  --struct: #1b1f1d;
  --wall-ext: #5b645f;
  --wall: #a2aaa4;
  --furn: #ffffff;
  --furn-soft: #eef1ec;
  --furn-line: #2f3a35;
  --built: #e3eee8;
  --rug: #e9e2d4;
  --grid: rgba(23, 32, 28, .07);
  --warn: #a8660f;
  --danger: #b42318;
  --danger-weak: #fbe6e2;
  --floor-filter: none;
  --g1: #b5523b; --g2: #c08a2d; --g3: #4f8a62; --g4: #2f6c8d; --g5: #7a5c99; --g6: #7d8640; --g7: #a24f78;
  --elec: #c2410c;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 14px;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  --gt: calc(16px + env(safe-area-inset-top, 0px));
  --gb: calc(16px + env(safe-area-inset-bottom, 0px));
  --mini-w: 300px; --mini-h: 216px; --drawer-w: 348px; --rail-w: 72px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --stage: #151a17; --ground: #1c221e; --surface: #1d2320; --surface-2: #252c28; --ink: #e7ece9; --muted: #9aa69f; --line: #2c3430; --line-strong: #3a443f;
    --accent: #4cc3a4; --accent-weak: #1d3a32; --on-accent: #08130f;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 30px rgba(0,0,0,.45); --shadow-sm: 0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
    --paper: #1e2420; --struct: #d7ded9; --wall-ext: #8c9690; --wall: #58625c; --furn: #2a322e; --furn-soft: #343e39; --furn-line: #cbd5cf; --built: #23352f; --rug: #3a3a33;
    --grid: rgba(231, 236, 233, .06); --warn: #e0a24a; --danger: #f0735f; --danger-weak: #3d201b; --floor-filter: brightness(.62) saturate(.85);
    --g1: #e07a60; --g2: #dcae55; --g3: #74b488; --g4: #5fa2c6; --g5: #a98bc9; --g6: #aab565; --g7: #d685ad; --elec: #fb923c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --stage: #151a17; --ground: #1c221e; --surface: #1d2320; --surface-2: #252c28; --ink: #e7ece9; --muted: #9aa69f; --line: #2c3430; --line-strong: #3a443f;
  --accent: #4cc3a4; --accent-weak: #1d3a32; --on-accent: #08130f;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 30px rgba(0,0,0,.45); --shadow-sm: 0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
  --paper: #1e2420; --struct: #d7ded9; --wall-ext: #8c9690; --wall: #58625c; --furn: #2a322e; --furn-soft: #343e39; --furn-line: #cbd5cf; --built: #23352f; --rug: #3a3a33;
  --grid: rgba(231, 236, 233, .06); --warn: #e0a24a; --danger: #f0735f; --danger-weak: #3d201b; --floor-filter: brightness(.62) saturate(.85);
  --g1: #e07a60; --g2: #dcae55; --g3: #74b488; --g4: #5fa2c6; --g5: #a98bc9; --g6: #aab565; --g7: #d685ad; --elec: #fb923c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--stage); color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
svg.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.ic.sm { width: 16px; height: 16px; }

.app { position: fixed; inset: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-sm); }

/* Views */
.view-main { position: absolute; inset: 0; background: var(--stage); z-index: 0; }
.view-main > svg, .view-main > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.view-main > svg { background: var(--paper); }
.labels3d { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
.rl { position: absolute; left: 0; top: 0; display: flex; align-items: baseline; gap: 6px; padding: 5px 11px; border-radius: 999px; background: var(--surface); color: var(--ink); font-size: 12.5px; font-weight: 600; white-space: nowrap; box-shadow: var(--shadow-sm); border: 1px solid var(--line); pointer-events: auto; cursor: pointer; will-change: transform; }
.rl small { font-weight: 400; color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.rl:hover { border-color: var(--accent); }
.rl.sel { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.rl.sel small { color: inherit; opacity: .7; }
.rl.entrance { background: var(--accent); color: var(--on-accent); border-color: var(--accent); align-items: center; }
.rl.entrance svg { width: 14px; height: 14px; }
.where { position: absolute; top: calc(var(--gt) + 60px); left: 50%; transform: translateX(-50%); padding: 6px 14px; font-size: 13px; display: flex; gap: 6px; align-items: center; }
.where small { color: var(--muted); }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; pointer-events: none; }
.loading span { background: var(--surface); padding: 8px 14px; border-radius: 999px; box-shadow: var(--shadow-sm); }

/* Top-left brand */
.brand { position: absolute; top: var(--gt); left: var(--gl); display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; }
.brand .mark { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.brand b { display: block; font-size: 14px; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; }
.brand small { display: block; color: var(--muted); font-size: 12px; line-height: 1.3; }

/* Top-center view controls */
.tc { position: absolute; top: var(--gt); left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
.seg { display: inline-flex; padding: 4px; gap: 2px; }
.seg button { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 10px; font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.seg button:hover { color: var(--ink); background: var(--surface-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

/* Top-right */
.tr { position: absolute; top: var(--gt); right: var(--gr); display: flex; gap: 8px; align-items: stretch; }
.iconbar { display: inline-flex; padding: 4px; gap: 2px; }
.iconbtn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--ink); }
.iconbtn:hover:not(:disabled) { background: var(--surface-2); }
.iconbtn:disabled { opacity: .3; cursor: default; }
.iconbtn[aria-pressed="true"] { background: var(--accent-weak); color: var(--accent); }
.card.iconbtn { width: 44px; height: 44px; }
.pill { display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 6px 14px; min-width: 168px; text-align: left; }
.pill .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.pill .lab { font-size: 11px; color: var(--muted); }
.pill b { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.pill .meter { height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
.pill .meter i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s; }
.pill.over b { color: var(--danger); }
.pill.over .meter i { background: var(--danger); }
.pill:hover { border-color: var(--line-strong); }

/* Tool rail */
.rail { position: absolute; left: var(--gl); top: calc(var(--gt) + 68px); width: var(--rail-w); display: flex; flex-direction: column; padding: 6px; gap: 2px; }
.tool { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 2px 7px; border-radius: 10px; font-size: 11px; font-weight: 500; color: var(--muted); }
.tool:hover { background: var(--surface-2); color: var(--ink); }
.tool[aria-pressed="true"] { background: var(--accent-weak); color: var(--accent); }
.rail hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }

/* Drawer */
.drawer { position: absolute; left: calc(var(--gl) + var(--rail-w) + 10px); top: calc(var(--gt) + 68px); bottom: var(--gb); width: var(--drawer-w); display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow); }
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 12px 10px 18px; }
.drawer-head h2 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.drawer-body > * { flex-shrink: 0; }
.drawer-body { flex: 1; overflow-y: auto; padding: 0 18px 18px; display: flex; flex-direction: column; gap: 18px; overscroll-behavior: contain; }
.sec { display: flex; flex-direction: column; gap: 8px; }
.eyebrow { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }
.note { font-size: 12.5px; border-radius: 10px; padding: 9px 11px; background: var(--surface-2); margin: 0; display: flex; gap: 8px; }
.note.bad { background: var(--danger-weak); }
.note svg { margin-top: 1px; }

.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 0 10px; background: var(--surface); }
.search input { border: 0; outline: 0; background: none; height: 38px; flex: 1; min-width: 0; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -18px; padding: 0 18px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-strong); font-size: 12.5px; font-weight: 500; color: var(--muted); }
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.icard { display: flex; flex-direction: column; text-align: left; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 8px 10px 10px; gap: 2px; min-width: 0; transition: border-color .12s, box-shadow .12s; }
.icard:hover { border-color: var(--accent); box-shadow: var(--shadow-sm); }
.icard .thumb { height: 74px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; margin-bottom: 6px; padding: 8px; }
.icard .thumb svg { width: 100%; height: 100%; }
.icard .nm { font-size: 13px; font-weight: 500; line-height: 1.25; }
.icard .mt { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.icard .tag { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }

.rows { display: flex; flex-direction: column; }
.rowbtn { display: flex; align-items: center; gap: 10px; padding: 9px 8px; margin: 0 -8px; border-radius: 10px; text-align: left; }
.rowbtn:hover { background: var(--surface-2); }
.rowbtn[aria-current="true"] { background: var(--accent-weak); }
.rowbtn .t { flex: 1; min-width: 0; }
.rowbtn .t b { display: block; font-weight: 500; font-size: 13.5px; }
.rowbtn .t small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rowbtn .v { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dot2 { width: 28px; height: 28px; border-radius: 8px; flex: none; position: relative; overflow: hidden; border: 1px solid var(--line-strong); }
.dot2 i { position: absolute; right: 0; bottom: 0; width: 50%; height: 50%; border-top-left-radius: 6px; border-left: 1px solid var(--line-strong); border-top: 1px solid var(--line-strong); }

.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; text-align: left; }
.opt:hover { border-color: var(--line-strong); }
.opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.opt .sw0 { width: 34px; height: 34px; border-radius: 8px; flex: none; border: 1px solid var(--line-strong); }
.opt .t { flex: 1; min-width: 0; font-size: 13px; font-weight: 500; }
.opt .t small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line-strong); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
.sw.none { background: repeating-linear-gradient(45deg, var(--surface) 0 4px, var(--line-strong) 4px 5px); }
.sw.sq { border-radius: 9px; width: 44px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.ghost { border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }

/* switch */
.switch { position: relative; width: 38px; height: 22px; border-radius: 999px; background: var(--line-strong); flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--danger); }
.switch[aria-checked="true"]::after { transform: translateX(16px); }

/* budget */
.total { font-size: 30px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.total small { font-size: 13px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
.stack { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--surface-2); gap: 2px; }
.stack i { display: block; height: 100%; }
.glist details { border-bottom: 1px solid var(--line); }
.glist summary { display: flex; align-items: center; gap: 10px; padding: 10px 0; cursor: pointer; list-style: none; font-size: 13.5px; }
.glist summary::-webkit-details-marker { display: none; }
.glist .k { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.glist .amt { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 500; }
.glist .chev { color: var(--muted); transition: transform .15s; }
.glist details[open] .chev { transform: rotate(90deg); }
.lines { display: flex; flex-direction: column; gap: 6px; padding: 0 0 12px 20px; }
.line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 10px; font-size: 12.5px; }
.line .d { color: var(--muted); font-size: 11.5px; }
.line .a { font-variant-numeric: tabular-nums; text-align: right; grid-row: 1; grid-column: 2; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 13px; align-items: center; }
.kv .a { text-align: right; font-variant-numeric: tabular-nums; }
.kv .grand { font-weight: 600; font-size: 15px; padding-top: 8px; border-top: 1px solid var(--line); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 9px; }
.stepper button { width: 30px; height: 30px; display: grid; place-items: center; color: var(--muted); }
.stepper button:hover { color: var(--ink); }
.stepper output { min-width: 24px; text-align: center; font-variant-numeric: tabular-nums; font-size: 13px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
.input { height: 36px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--surface); padding: 0 10px; color: var(--ink); font-size: 13px; width: 100%; min-width: 0; font-variant-numeric: tabular-nums; }
.rates { display: grid; grid-template-columns: minmax(0, 1fr) 92px; gap: 6px 10px; align-items: center; font-size: 12.5px; padding-top: 8px; }
.rates h4 { grid-column: 1 / -1; margin: 10px 0 0; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.rates .input { height: 30px; text-align: right; }
details.more > summary { cursor: pointer; font-size: 13px; font-weight: 500; color: var(--accent); list-style: none; }
details.more > summary::-webkit-details-marker { display: none; }

/* Selection bar */
.bottom-zone { position: absolute; bottom: var(--gb); left: calc(var(--gl) + var(--rail-w) + 12px); right: calc(var(--gr) + var(--mini-w) + 12px); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.app.drawer-open .bottom-zone { left: calc(var(--gl) + var(--rail-w) + var(--drawer-w) + 22px); }
.bottom-zone > * { pointer-events: auto; }
.selbar { display: flex; align-items: center; gap: 4px; padding: 6px; max-width: 100%; box-shadow: var(--shadow); flex-wrap: wrap; justify-content: center; }
.selbar .who { display: flex; align-items: center; gap: 10px; padding: 0 10px 0 4px; min-width: 0; }
.selbar .who .th { width: 40px; height: 40px; border-radius: 9px; background: var(--surface-2); display: grid; place-items: center; padding: 5px; flex: none; }
.selbar .who .th svg { width: 100%; height: 100%; }
.selbar .who b { display: block; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
.selbar .who small { display: block; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.selbar .sep { width: 1px; align-self: stretch; background: var(--line); margin: 4px 4px; }
.selbar .dims { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.selbar .dims input { width: 72px; height: 32px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); padding: 0 8px; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink); }
.selbar .iconbtn { width: 38px; height: 38px; }
.selbar .iconbtn.danger { color: var(--danger); }
.flag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--danger); background: var(--danger-weak); border-radius: 999px; padding: 3px 9px; }
.flag.ok { color: var(--accent); background: var(--accent-weak); }
.flag.neutral { color: var(--muted); background: var(--surface-2); }
.minisw { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--line-strong); flex: none; }
.chipbtn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 10px; border-radius: 10px; font-size: 12.5px; }
.chipbtn:hover { background: var(--surface-2); }
.chipbtn small { display: block; color: var(--muted); font-size: 11px; line-height: 1.1; }
.chipbtn span { text-align: left; line-height: 1.2; }
.hintchip { display: flex; align-items: center; gap: 10px; background: color-mix(in srgb, var(--ink) 86%, transparent); color: var(--surface); padding: 7px 8px 7px 14px; border-radius: 999px; font-size: 12.5px; box-shadow: var(--shadow-sm); max-width: 100%; }
.hintchip button { color: inherit; opacity: .75; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.hintchip button:hover { opacity: 1; background: rgba(255,255,255,.12); }

/* Mini map / inset */

const r_ = (x, y, w, h, c = 'fl', rx = 0) => `<rect x="${x}" y="${y}" width="${Math.max(0, w)}" height="${Math.max(0, h)}" rx="${rx}" class="${c}"/>`;

function polyArea(p) { let a = 0; for (let i = 0; i < p.length; i++) { const [x1, y1] = p[i], [x2, y2] = p[(i + 1) % p.length]; a += x1 * y2 - x2 * y1; } return Math.abs(a) / 2 / 1e6; }

    if (!tps.has(e.pointerId)) return; tps.set(e.pointerId, e);
    if (tps.size === 2 && twist != null && selItem() && !UI.before) { const [a, b] = [...tps.values()]; const ang = Math.atan2(b.clientY - a.clientY, b.clientX - a.clientX); let da = (ang - twist) * 180 / Math.PI; da = ((da + 540) % 360) - 180; if (Math.abs(da) > 35) { twist = ang; rotateSel(da > 0 ? 90 : -90); } }
  }, true);
  const tpEnd = e => { tps.delete(e.pointerId); if (tps.size < 2) twist = null; };
  cv.addEventListener('pointerup', tpEnd, true); cv.addEventListener('pointercancel', tpEnd, true);
  const up = e => {
    if (!down) return; const dn = down; down = null; controls.enabled = true; cv.style.cursor = '';
    if (dn.drag && dn.moved) { pushUndo(dn.drag.snap); persist(); UI.sel = { kind: 'item', id: dn.drag.it.id }; renderAll(); return; }
    if (dn.moved) return;
    if (e && e.pointerType === 'touch') { // double-tap a floor to walk there
      const now = performance.now();
      if (lastTap && now - lastTap.t < 350 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30) { lastTap = null; const p = floorPt(e); if (p && roomAt(p.x, p.y)) { camWalk(p.x / 1000, p.y / 1000); return; } }
      else lastTap = { t: now, x: e.clientX, y: e.clientY };
    }
    const i = dn.info;
    select(i ? (i.item ? { kind: 'item', id: i.item } : i.wall ? { kind: 'wall', id: i.wall } : { kind: 'room', id: i.room }) : null);
  };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', () => { down = null; controls.enabled = true; });
  cv.addEventListener('dblclick', e => { const p = floorPt(e); if (p && roomAt(p.x, p.y)) camWalk(p.x / 1000, p.y / 1000); });
  cv.addEventListener('dragover', e => { e.preventDefault(); });
  cv.addEventListener('drop', e => { e.preventDefault(); const t = e.dataTransfer.getData('text/plain'); const p = floorPt(e); if (CAT[t] && p) addItem(t, p.x, p.y); });
}

/* ================================================================
   Selection, items
================================================================ */
function select(sel) {
  UI.sel = sel;
  if (sel && sel.kind === 'room' && UI.tool === 'finishes') UI.finRoom = sel.id;
  renderWalls(); renderOverlay(); renderSelBar(); renderHint();
  if (UI.tool === 'finishes' || UI.tool === 'walls') renderDrawer();
  if (V3.ready) { buildMarks(); requestRender(); }
}
function addItem(type, cx, cy) {
  if (cx == null) {
    let p = null;
    if (UI.main === '3d' && V3.ready) { const c = V3.floorAtCenter(); if (c && roomAt(c.x, c.y)) p = c; if (!p) p = { x: controls.target.x * 1000, y: controls.target.z * 1000 }; }
    else p = { x: VB.x + VB.w / 2, y: VB.y + VB.h / 2 };
    cx = p.x; cy = p.y;
  }
  const t = CAT[type];
  const it = { id: uid(), type, w: t.w, d: t.d, rot: 0, x: cx - t.w / 2, y: cy - t.d / 2 };
  mutate(() => { snapItem(it); S.items.push(it); UI.sel = { kind: 'item', id: it.id }; UI.show.furn = true; });
  toast(`${t.name} added. Drag it into place.`);
}
function rotateSel(deg) {
  const it = selItem(); if (!it) return;
  mutate(() => { const f = fp(it), cx = f.x + f.w / 2, cy = f.y + f.h / 2; it.rot = ((it.rot + deg) % 360 + 360) % 360; const g = fp(it); it.x = cx - g.w / 2; it.y = cy - g.h / 2; snapItem(it); });
}
function deleteSel() { const it = selItem(); if (!it) return; const n = CAT[it.type].name; mutate(() => { S.items = S.items.filter(i => i !== it); UI.sel = null; }); toast(`${n} removed`); }
function dupSel() { const it = selItem(); if (!it) return; const c = { ...it, id: uid(), x: it.x + 200, y: it.y + 200 }; mutate(() => { snapItem(c); S.items.push(c); UI.sel = { kind: 'item', id: c.id }; }); }
function nudge(dx, dy) { const it = selItem(); if (!it) return; mutate(() => { it.x += dx; it.y += dy; }); }
function toggleWall(id) { mutate(() => { const cur = S.walls[id] && S.walls[id].removed; S.walls[id] = { removed: !cur }; }); toast(S.walls[id].removed ? 'Wall marked for removal' : 'Wall restored'); }

/* ---------------- Selection bar ---------------- */
const thumb = (type, cls = '') => { const t = CAT[type]; return `<svg viewBox="${-60} ${-60} ${t.w + 120} ${t.d + 120}" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><g class="item ${t.rate ? 'built' : ''} ${cls}">${drawItem(type, t.w, t.d)}</g></svg>`; };
function floorSwatch(r) { const st = S.rooms[r.id]; return patSpec(r, st).c[0]; }
function renderSelBar() {
  const bar = $('#selbar'), sel = UI.sel;

      <span class="sep"></span>
      <button class="btn primary sm" data-sb="fin">Change finishes</button>
      ${close}`;

    <span class="sep"></span>
    <button class="btn sm ${rem ? 'primary' : 'danger'}" data-sb="wall">${rem ? 'Restore wall' : 'Remove wall'}</button>${close}`;
}
$('#selbar').addEventListener('click', e => {
  const b = e.target.closest('[data-sb]'); if (!b) return;
  const k = b.dataset.sb;
  if (k === 'close') return select(null);
  if (k === 'rotl') return rotateSel(-90);
  if (k === 'rotr') return rotateSel(90);
  if (k === 'dup') return dupSel();
  if (k === 'del') return deleteSel();

/* ---------------- Keyboard ---------------- */
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, select')) return;
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (mod && k === 'd') { e.preventDefault(); dupSel(); return; }
  if (mod) return;
  if (UI.main === '3d' && UI.cam === 'walk' && ['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) { e.preventDefault(); keys.add(k); requestRender(); return; }
  const step = e.shiftKey ? 100 : 10;
  switch (k) {
    case 'delete': case 'backspace': if (selItem()) { e.preventDefault(); deleteSel(); } break;
    case 'r': rotateSel(e.shiftKey ? -90 : 90); break;
    case 'm': openTool('measure'); break;
    case 'b': setBefore(!UI.before); break;
    case 'tab': if (V3.ready) { e.preventDefault(); setMain(UI.main === '3d' ? '2d' : '3d'); } break;
    case 'escape':
      if (!$('#export').hidden) { $('#export').hidden = true; $('#export').innerHTML = ''; }
      else if (dsUI.open) { dsUI.open = false; renderDesigns(); }
      else if (UI.menu) { UI.menu = null; renderMenu(); }
      else if (UI.tool === 'measure') closeTool();
      else if (UI.sel) select(null);
      else if (UI.tool) closeTool();
      else if (UI.cam === 'walk') camOrbit();
      break;
    case 'arrowleft': if (selItem()) { e.preventDefault(); nudge(-step, 0); } break;
    case 'arrowright': if (selItem()) { e.preventDefault(); nudge(step, 0); } break;
    case 'arrowup': if (selItem()) { e.preventDefault(); nudge(0, -step); } break;
    case 'arrowdown': if (selItem()) { e.preventDefault(); nudge(0, step); } break;
  }
});
document.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
window.addEventListener('blur', () => keys.clear());

(() => {
  const joy = $('#joy'), knob = $('#joy-knob'); let pid = null;
  const move = e => { const r = joy.getBoundingClientRect(); let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2); const L = Math.hypot(dx, dy), M = 40; if (L > M) { dx *= M / L; dy *= M / L; } JOY.x = dx / M; JOY.y = dy / M; knob.style.transform = `translate(${dx}px, ${dy}px)`; requestRender(); };
  joy.addEventListener('pointerdown', e => { pid = e.pointerId; joy.setPointerCapture(pid); JOY.on = true; move(e); });
  joy.addEventListener('pointermove', e => { if (e.pointerId === pid) move(e); });
  const end = e => { if (e.pointerId !== pid) return; pid = null; JOY.on = false; JOY.x = JOY.y = 0; knob.style.transform = ''; };
  joy.addEventListener('pointerup', end); joy.addEventListener('pointercancel', end);
})();

  c.querySelectorAll('#g-over, #g-cam').forEach(g => g.remove());

}
function snapshot3D(kind) {
  if (!V3.ready) return null;
  const save = { p: camera.position.clone(), t: controls.target.clone(), fov: camera.fov, cam: UI.cam };
  renderer.setSize(1600, 1000, false); camera.aspect = 1.6;
  UI.cam = kind === 'walk' ? 'walk' : 'orbit'; setScenery(); gMarks.visible = false;
  if (kind === 'walk') { camera.position.set(11.4, 1.6, 4.7); camera.fov = 68; camera.lookAt(10.4, 1.5, 4.55); }
  else { camera.position.set(6.3 + 3.9, 13.8, 4.4 + 12.4); camera.fov = 40; camera.lookAt(6.3, 0, 4.4); }
  camera.updateProjectionMatrix(); renderer.shadowMap.needsUpdate = true; renderer.render(scene, camera);
  const url = cv.toDataURL('image/jpeg', 0.9);
  UI.cam = save.cam; setScenery(); gMarks.visible = true;
  camera.position.copy(save.p); controls.target.copy(save.t); camera.fov = save.fov; camera.updateProjectionMatrix();
  size3D(); controls.update(); requestRender();
  return url;
}

function download(name, url) { const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
function planPNG() {
  const src = $('#x-plan svg'); if (!src) return;
  const c = src.cloneNode(true), sEls = src.querySelectorAll('*'), cEls = c.querySelectorAll('*');
  const props = ['fill', 'fill-opacity', 'stroke', 'stroke-width', 'stroke-dasharray', 'stroke-linejoin', 'opacity', 'font-family', 'font-size', 'font-weight', 'letter-spacing', 'text-anchor', 'paint-order', 'display', 'vector-effect'];
  sEls.forEach((el, i) => { const cs = getComputedStyle(el); cEls[i].setAttribute('style', props.map(p => `${p}:${cs.getPropertyValue(p)}`).join(';')); });
  c.setAttribute('xmlns', 'http://www.w3.org/2000/svg'); c.setAttribute('width', 3000); c.setAttribute('height', Math.round(3000 * 11550 / 15100));
  const blob = new Blob([new XMLSerializer().serializeToString(c)], { type: 'image/svg+xml' }), url = URL.createObjectURL(blob), img = new Image();
  img.onload = () => { const cv2 = document.createElement('canvas'); cv2.width = img.width; cv2.height = img.height; const g = cv2.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv2.width, cv2.height); g.drawImage(img, 0, 0); URL.revokeObjectURL(url); download(`blk74a-plan-${DS.list[DS.active].name.replace(/\W+/g, '-').toLowerCase()}.png`, cv2.toDataURL('image/png')); };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Couldn’t create the image in this browser.'); };
  img.src = url;
}
