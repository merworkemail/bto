<!doctype html><!--shell-->
<html lang="en"><!--shell-->
<head><!--shell-->
<meta charset="utf-8"><!--shell-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><!--shell-->
<title>Blk 74A Reno Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: drafting-table app shell. Catalogue | to-scale plan | inspector + budget. Plan is the hero. */
:root {
  --bg: #e7eae5;
  --panel: #f6f7f3;
  --paper: #fcfcf9;
  --ink: #1c2420;
  --muted: #5b6760;
  --line: #cdd3cc;
  --accent: #0d6b5c;
  --accent-soft: #d5e9e3;
  --accent-ink: #ffffff;
  --struct: #1a1e1c;
  --wall-ext: #59625d;
  --wall: #9aa39d;
  --furn: #ffffff;
  --furn-soft: #eef1ec;
  --furn-line: #2f3a35;
  --built: #e6efe9;
  --rug: #e9e2d4;
  --grid: rgba(28, 36, 32, .07);
  --warn: #a8660f;
  --danger: #b42318;
  --danger-soft: #f8e0dc;
  --floor-filter: none;
  --g1: #b5523b; --g2: #c08a2d; --g3: #4f8a62; --g4: #2f6c8d; --g5: #7a5c99; --g6: #7d8640;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111513; --panel: #181d1a; --paper: #1e2420; --ink: #e5ebe7; --muted: #98a59e; --line: #313a35;
    --accent: #48c2a3; --accent-soft: #1f3a33; --accent-ink: #0b1411;
    --struct: #d7ded9; --wall-ext: #8c9690; --wall: #59635d;
    --furn: #2a322e; --furn-soft: #343e39; --furn-line: #cbd5cf; --built: #23352f; --rug: #3a3a33;
    --grid: rgba(229, 235, 231, .06); --warn: #e0a24a; --danger: #f0735f; --danger-soft: #3d201b;
    --floor-filter: brightness(.6) saturate(.85);
    --g1: #e07a60; --g2: #dcae55; --g3: #74b488; --g4: #5fa2c6; --g5: #a98bc9; --g6: #aab565;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111513; --panel: #181d1a; --paper: #1e2420; --ink: #e5ebe7; --muted: #98a59e; --line: #313a35;
  --accent: #48c2a3; --accent-soft: #1f3a33; --accent-ink: #0b1411;
  --struct: #d7ded9; --wall-ext: #8c9690; --wall: #59635d;
  --furn: #2a322e; --furn-soft: #343e39; --furn-line: #cbd5cf; --built: #23352f; --rug: #3a3a33;
  --grid: rgba(229, 235, 231, .06); --warn: #e0a24a; --danger: #f0735f; --danger-soft: #3d201b;
  --floor-filter: brightness(.6) saturate(.85);
  --g1: #e07a60; --g2: #dcae55; --g3: #74b488; --g4: #5fa2c6; --g5: #a98bc9; --g6: #aab565;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font-body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  height: 100%;
  display: grid;
  grid-template-columns: 272px minmax(0, 1fr) 340px;
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "top top top" "cat plan side";
  gap: 10px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; min-height: 0; }

/* Top bar */
.top { grid-area: top; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 14px; }
.brand { display: flex; flex-direction: column; min-width: 0; margin-right: auto; }
.brand h1 { font: 700 18px/1.1 var(--font-display); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--paper); }
.seg button { border: 0; background: transparent; padding: 6px 10px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button:disabled { opacity: .4; cursor: default; }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 6px 11px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.danger.confirm { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn.small { padding: 4px 8px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: default; }
svg.ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.total-chip { display: flex; flex-direction: column; align-items: flex-end; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 4px 10px; min-width: 150px; }
.total-chip b { font: 600 15px/1.2 var(--font-mono); font-variant-numeric: tabular-nums; }
.total-chip span { font-size: 11px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.total-chip .bar { width: 100%; height: 4px; border-radius: 2px; background: var(--line); margin-top: 3px; overflow: hidden; }
.total-chip .bar i { display: block; height: 100%; background: var(--accent); }
.total-chip.over .bar i { background: var(--danger); }
.total-chip.over b { color: var(--danger); }

/* Catalogue */
.cat { grid-area: cat; display: flex; flex-direction: column; overflow: hidden; }
.cat-head { padding: 12px 12px 8px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.cat-head h2, .side h2 { font: 600 12px/1 var(--font-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; }
.search { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); padding: 7px 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 2px 9px; font-size: 12px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.cat-list { overflow-y: auto; padding: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-content: start; }
.card { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 6px; display: flex; flex-direction: column; gap: 3px; text-align: left; min-width: 0; }
.card:hover { border-color: var(--accent); }
.card svg { width: 100%; height: 58px; }
.card .nm { font-size: 12.5px; font-weight: 500; line-height: 1.25; }
.card .mt { font: 11px/1.3 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.card .tag { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
.cat-foot { padding: 8px 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }

/* Plan */
.plan-wrap { grid-area: plan; position: relative; overflow: hidden; background: var(--paper); }
#plan { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
#plan.measure { cursor: crosshair; }
#plan.panning { cursor: grabbing; }
.plan-hud { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
.plan-hud > * { pointer-events: auto; }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 34px; height: 34px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; display: grid; place-items: center; }
.legend { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font-size: 11.5px; display: flex; gap: 10px; flex-wrap: wrap; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 8px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
#c3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.hud3d { position: absolute; left: 10px; top: 10px; right: 54px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none; }
.hud3d > * { pointer-events: auto; }
.hud3d .hint3d { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font-size: 12px; color: var(--muted); }
.loading3d { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; color: var(--muted); pointer-events: none; }
.scale-note { position: absolute; left: 10px; top: 10px; font: 11px var(--font-mono); color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 7px; pointer-events: none; }

/* SVG styling */
.room { cursor: pointer; filter: var(--floor-filter); }
.room-sel { fill: var(--accent); fill-opacity: .1; stroke: var(--accent); stroke-width: 2.5px; vector-effect: non-scaling-stroke; pointer-events: none; }
.ledge { fill: url(#hatch); stroke: var(--muted); stroke-width: 1px; vector-effect: non-scaling-stroke; }
.wall rect { vector-effect: non-scaling-stroke; }
.wall.k-struct rect { fill: var(--struct); }
.wall.k-ext rect { fill: var(--wall-ext); }
.wall.k-part rect, .wall.k-wet rect { fill: var(--wall); cursor: pointer; }
.wall.k-wet rect { fill: var(--wall); stroke: var(--wall-ext); stroke-width: .8px; stroke-dasharray: 3 2; }
.wall.k-struct rect, .wall.k-ext rect { cursor: pointer; }
.wall.k-part:hover rect, .wall.k-wet:hover rect { fill: var(--accent); }
.wall.removed rect { fill: transparent; stroke: var(--danger); stroke-width: 1.2px; stroke-dasharray: 5 4; }
.wall.removed:hover rect { fill: var(--danger-soft); }
.wall.sel rect { stroke: var(--accent); stroke-width: 2.5px; }
.wall.sel.removed rect { stroke: var(--danger); }
.win-glass { fill: var(--paper); stroke: var(--ink); stroke-width: .9px; vector-effect: non-scaling-stroke; }
.win-line { stroke: var(--ink); stroke-width: .7px; vector-effect: non-scaling-stroke; }
.door-leaf { stroke: var(--ink); stroke-width: 1.4px; fill: none; vector-effect: non-scaling-stroke; }
.door-arc { stroke: var(--muted); stroke-width: .9px; stroke-dasharray: 4 3; fill: none; vector-effect: non-scaling-stroke; }
.room-label { font: 600 230px var(--font-display); fill: var(--ink); text-anchor: middle; paint-order: stroke; stroke: var(--paper); stroke-width: 50px; stroke-linejoin: round; pointer-events: none; letter-spacing: 4px; }
.room-sub { font: 400 150px var(--font-mono); fill: var(--muted); text-anchor: middle; paint-order: stroke; stroke: var(--paper); stroke-width: 40px; pointer-events: none; }
.dim { stroke: var(--muted); stroke-width: .8px; vector-effect: non-scaling-stroke; fill: none; }
.dim-t { font: 400 170px var(--font-mono); fill: var(--muted); text-anchor: middle; }
.grid-fill { fill: url(#gridpat); pointer-events: none; }
.gridline { stroke: var(--grid); stroke-width: 1px; vector-effect: non-scaling-stroke; }

.item { cursor: grab; }
.item .hit { fill: transparent; }
.fl { fill: var(--furn); stroke: var(--furn-line); stroke-width: 1.2px; vector-effect: non-scaling-stroke; }
.fs { fill: var(--furn-soft); stroke: var(--furn-line); stroke-width: .8px; vector-effect: non-scaling-stroke; }
.fd { fill: none; stroke: var(--furn-line); stroke-width: .8px; vector-effect: non-scaling-stroke; }
.fdash { fill: none; stroke: var(--furn-line); stroke-width: 1px; stroke-dasharray: 5 3; vector-effect: non-scaling-stroke; }
.rugf { fill: var(--rug); stroke: var(--furn-line); stroke-width: .8px; vector-effect: non-scaling-stroke; opacity: .9; }
.item.built .fl { fill: var(--built); }
.item.warn .fl, .item.warn .fdash { stroke: var(--danger); }
.item-label { font: 500 120px var(--font-body); fill: var(--muted); text-anchor: middle; pointer-events: none; }
.sel-box { fill: none; stroke: var(--accent); stroke-width: 1.5px; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke; pointer-events: none; }
.sel-box.warn { stroke: var(--danger); }
.handle { fill: var(--accent); stroke: var(--paper); stroke-width: 2px; vector-effect: non-scaling-stroke; cursor: nwse-resize; }
.handle.rot { cursor: pointer; }
.clr { stroke: var(--accent); stroke-width: 1px; vector-effect: non-scaling-stroke; }
.clr-t { font: 500 140px var(--font-mono); fill: var(--accent); text-anchor: middle; paint-order: stroke; stroke: var(--paper); stroke-width: 40px; }
.meas { stroke: var(--warn); stroke-width: 2px; vector-effect: non-scaling-stroke; }
.meas-t { font: 600 200px var(--font-mono); fill: var(--warn); text-anchor: middle; paint-order: stroke; stroke: var(--paper); stroke-width: 50px; }

/* Side */
.side { grid-area: side; display: flex; flex-direction: column; overflow: hidden; }
.tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 8px; gap: 2px; }
.tabs button { border: 0; background: none; padding: 11px 10px 9px; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.pane { overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.sec { display: flex; flex-direction: column; gap: 8px; }
.sec h3 { margin: 0; font: 600 16px/1.2 var(--font-display); text-wrap: balance; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }
.note { font-size: 12.5px; border-radius: 8px; padding: 8px 10px; background: var(--accent-soft); color: var(--ink); margin: 0; }
.note.bad { background: var(--danger-soft); }
.badge { display: inline-block; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.badge.struct { background: var(--struct); color: var(--paper); border-color: var(--struct); }
.badge.ok { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.badge.bad { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.field { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); min-width: 0; }
.field input, .field select { border: 1px solid var(--line); background: var(--paper); border-radius: 7px; padding: 6px 8px; color: var(--ink); font-size: 13px; width: 100%; min-width: 0; }
.field input[type="number"] { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opts { display: grid; grid-template-columns: 1fr; gap: 4px; }
.opt { display: flex; justify-content: space-between; gap: 8px; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 7px 9px; font-size: 13px; text-align: left; }
.opt small { font-family: var(--font-mono); color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); padding: 0; position: relative; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }
.sw.none { background: repeating-linear-gradient(45deg, var(--paper) 0 4px, var(--line) 4px 5px); }
.tone { border-radius: 6px; width: 46px; height: 30px; }
.roomlist { display: flex; flex-direction: column; gap: 2px; }
.roomlist button { display: flex; justify-content: space-between; gap: 8px; border: 0; background: none; padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; font-size: 13px; }
.roomlist button:hover { color: var(--accent); }
.roomlist span:last-child { font-family: var(--font-mono); color: var(--muted); font-size: 12px; white-space: nowrap; }

/* Budget */
.big { font: 600 28px/1.1 var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.big small { font-size: 13px; color: var(--muted); font-weight: 400; letter-spacing: 0; }
.stack { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line); }
.stack i { display: block; height: 100%; }
.target-line { position: relative; }
.glist { display: flex; flex-direction: column; }
.glist details { border-bottom: 1px solid var(--line); }
.glist summary { display: flex; align-items: center; gap: 8px; padding: 8px 2px; cursor: pointer; list-style: none; font-size: 13.5px; }
.glist summary::-webkit-details-marker { display: none; }
.glist summary .dot { width: 9px; height: 9px; border-radius: 2px; flex: none; }
.glist summary .amt { margin-left: auto; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.glist summary .chev { color: var(--muted); transition: transform .15s; }
.glist details[open] summary .chev { transform: rotate(90deg); }
.lines { display: flex; flex-direction: column; gap: 2px; padding: 0 2px 10px 19px; }
.line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; font-size: 12.5px; }
.line .d { color: var(--muted); font-size: 11.5px; font-family: var(--font-mono); grid-column: 1; }
.line .a { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; grid-row: 1; grid-column: 2; }
.extras { display: flex; flex-direction: column; gap: 6px; }
.extra { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; font-size: 13px; }
.extra small { display: block; color: var(--muted); font-family: var(--font-mono); font-size: 11px; }
.step { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); }
.step button { border: 0; background: none; width: 28px; height: 28px; }
.step output { min-width: 26px; text-align: center; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.totals { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; }
.totals .a { font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }
.totals .grand { font-weight: 600; font-size: 15px; border-top: 1px solid var(--line); padding-top: 6px; }
.rates { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 6px 10px; align-items: center; font-size: 13px; }
.rates input { border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 4px 6px; width: 100%; font-family: var(--font-mono); text-align: right; }
.rates h4 { grid-column: 1 / -1; margin: 8px 0 0; font: 600 11px var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Layout manager popover */
.pop { position: absolute; z-index: 30; top: 64px; right: max(16px, env(safe-area-inset-right, 0px)); width: min(380px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 18px 40px rgba(0,0,0,.18); padding: 14px; display: flex; flex-direction: column; gap: 12px; max-height: calc(100% - 80px); overflow-y: auto; }
.pop h3 { margin: 0; font: 600 15px var(--font-display); }
.saved { display: flex; flex-direction: column; gap: 4px; }
.saved .srow { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.saved .srow span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.saved .srow small { color: var(--muted); font-family: var(--font-mono); font-size: 11px; }
textarea { width: 100%; min-height: 80px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); padding: 8px; font: 12px var(--font-mono); resize: vertical; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 50; max-width: calc(100vw - 32px); }

@media (max-width: 1080px) {
  .app { grid-template-columns: 240px minmax(0, 1fr); grid-template-areas: "top top" "cat plan" "side side"; grid-template-rows: auto minmax(460px, 1fr) auto; height: auto; min-height: 100%; }
  .side { max-height: none; }
}
@media (max-width: 720px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "plan" "cat" "side"; grid-template-rows: auto 62vh auto auto; }

  S.items.forEach(it => {
    if (CAT[it.type].under) return;
    const f = fp(it);
    if (walls.some(w => ovl(f, w))) bad.set(it.id, 'Overlaps a wall');
  });
  for (let i = 0; i < solid.length; i++) for (let j = i + 1; j < solid.length; j++) {
    if (ovl(fp(solid[i]), fp(solid[j]))) {
      if (!bad.has(solid[i].id)) bad.set(solid[i].id, 'Overlaps ' + CAT[solid[j].type].name.toLowerCase());
      if (!bad.has(solid[j].id)) bad.set(solid[j].id, 'Overlaps ' + CAT[solid[i].type].name.toLowerCase());

    if (vOv) {

      if (w.x >= f.x + f.w - 1) res.r = Math.min(res.r, w.x - (f.x + f.w));
    }
    if (hOv) {
      if (w.y + w.h <= f.y + 1) res.t = Math.min(res.t, f.y - (w.y + w.h));
      if (w.y >= f.y + f.h - 1) res.b = Math.min(res.b, w.y - (f.y + f.h));

  it.x = Math.round(it.x / 50) * 50; it.y = Math.round(it.y / 50) * 50;
  const f = fp(it), c = clearances(f), T = 130;
