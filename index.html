<!doctype html><!--shell-->
<html lang="en"><!--shell-->
<head><!--shell-->
<meta charset="utf-8"><!--shell-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><!--shell-->
<title>Blk 74A Reno Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D stage; floating chrome — brand (TL), view controls (TC), history + budget (TR),
   tool rail + one slide-out drawer (L), contextual selection bar (B), plan inset that swaps with 3D (BR). */
:root {
  --stage: #e8ebe7;
  --ground: #dcdfda;
  --surface: #ffffff;
  --surface-2: #f3f5f2;
  --ink: #17201c;
  --muted: #66716b;
  --line: #e3e7e2;
  --line-strong: #cfd5ce;
  --accent: #0f6e5e;
  --accent-weak: #e2f0eb;
  --on-accent: #ffffff;
  --shadow: 0 1px 2px rgba(18, 28, 24, .06), 0 10px 28px rgba(18, 28, 24, .12);
  --shadow-sm: 0 1px 2px rgba(18, 28, 24, .08), 0 4px 12px rgba(18, 28, 24, .08);
  /* plan drawing */
  --paper: #fbfbf8;
  --struct: #1b1f1d;
  --wall-ext: #5b645f;
  --wall: #a2aaa4;
  --furn: #ffffff;
  --furn-soft: #eef1ec;
  --furn-line: #2f3a35;
  --built: #e3eee8;
  --rug: #e9e2d4;
  --grid: rgba(23, 32, 28, .07);
  --warn: #a8660f;
  --danger: #b42318;
  --danger-weak: #fbe6e2;
  --floor-filter: none;
  --g1: #b5523b; --g2: #c08a2d; --g3: #4f8a62; --g4: #2f6c8d; --g5: #7a5c99; --g6: #7d8640; --g7: #a24f78;
  --elec: #c2410c;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 14px;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  --gt: calc(16px + env(safe-area-inset-top, 0px));
  --gb: calc(16px + env(safe-area-inset-bottom, 0px));
  --mini-w: 300px; --mini-h: 216px; --drawer-w: 348px; --rail-w: 72px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --stage: #151a17; --ground: #1c221e; --surface: #1d2320; --surface-2: #252c28; --ink: #e7ece9; --muted: #9aa69f; --line: #2c3430; --line-strong: #3a443f;
    --accent: #4cc3a4; --accent-weak: #1d3a32; --on-accent: #08130f;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 30px rgba(0,0,0,.45); --shadow-sm: 0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
    --paper: #1e2420; --struct: #d7ded9; --wall-ext: #8c9690; --wall: #58625c; --furn: #2a322e; --furn-soft: #343e39; --furn-line: #cbd5cf; --built: #23352f; --rug: #3a3a33;
    --grid: rgba(231, 236, 233, .06); --warn: #e0a24a; --danger: #f0735f; --danger-weak: #3d201b; --floor-filter: brightness(.62) saturate(.85);
    --g1: #e07a60; --g2: #dcae55; --g3: #74b488; --g4: #5fa2c6; --g5: #a98bc9; --g6: #aab565; --g7: #d685ad; --elec: #fb923c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --stage: #151a17; --ground: #1c221e; --surface: #1d2320; --surface-2: #252c28; --ink: #e7ece9; --muted: #9aa69f; --line: #2c3430; --line-strong: #3a443f;
  --accent: #4cc3a4; --accent-weak: #1d3a32; --on-accent: #08130f;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 30px rgba(0,0,0,.45); --shadow-sm: 0 1px 2px rgba(0,0,0,.4), 0 4px 12px rgba(0,0,0,.3);
  --paper: #1e2420; --struct: #d7ded9; --wall-ext: #8c9690; --wall: #58625c; --furn: #2a322e; --furn-soft: #343e39; --furn-line: #cbd5cf; --built: #23352f; --rug: #3a3a33;
  --grid: rgba(231, 236, 233, .06); --warn: #e0a24a; --danger: #f0735f; --danger-weak: #3d201b; --floor-filter: brightness(.62) saturate(.85);
  --g1: #e07a60; --g2: #dcae55; --g3: #74b488; --g4: #5fa2c6; --g5: #a98bc9; --g6: #aab565; --g7: #d685ad; --elec: #fb923c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--stage); color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
svg.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.ic.sm { width: 16px; height: 16px; }

.app { position: fixed; inset: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow-sm); }

/* Views */
.view-main { position: absolute; inset: 0; background: var(--stage); z-index: 0; }
.view-main > svg, .view-main > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.view-main > svg { background: var(--paper); }
.labels3d { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
.rl { position: absolute; left: 0; top: 0; display: flex; align-items: baseline; gap: 6px; padding: 5px 11px; border-radius: 999px; background: var(--surface); color: var(--ink); font-size: 12.5px; font-weight: 600; white-space: nowrap; box-shadow: var(--shadow-sm); border: 1px solid var(--line); pointer-events: auto; cursor: pointer; will-change: transform; }
.rl small { font-weight: 400; color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.rl:hover { border-color: var(--accent); }
.rl.sel { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.rl.sel small { color: inherit; opacity: .7; }
.rl.entrance { background: var(--accent); color: var(--on-accent); border-color: var(--accent); align-items: center; }
.rl.entrance svg { width: 14px; height: 14px; }
.where { position: absolute; top: calc(var(--gt) + 60px); left: 50%; transform: translateX(-50%); padding: 6px 14px; font-size: 13px; display: flex; gap: 6px; align-items: center; }
.where small { color: var(--muted); }
.where { cursor: pointer; }
.where:hover { border-color: var(--line-strong); }
.pop.roomlist2 { left: 50%; transform: translateX(-50%); top: calc(var(--gt) + 102px); width: min(280px, calc(100vw - 32px)); padding: 6px; gap: 0; }
.roomlist2 button { text-align: left; padding: 9px 10px; border-radius: 9px; font-size: 13.5px; display: flex; justify-content: space-between; }
.roomlist2 button:hover, .roomlist2 button[aria-selected="true"] { background: var(--surface-2); }
.roomlist2 button small { color: var(--muted); }
.pop.sharepop { left: auto; right: var(--gr); top: calc(var(--gt) + 56px); width: min(380px, calc(100vw - 32px)); }
.pop.sunpop { left: auto; right: var(--gr); top: calc(var(--gt) + 60px); width: min(360px, calc(100vw - 32px)); }
.sunrow { display: flex; gap: 12px; align-items: flex-end; }
.sunrow input[type=range] { width: 100%; accent-color: var(--accent); height: 36px; }
.sunnow { margin: 0; font-size: 13px; padding: 9px 11px; border-radius: 10px; background: var(--surface-2); }
.hotrow { display: grid; grid-template-columns: 1fr 90px 36px; gap: 8px; align-items: center; font-size: 12.5px; }
.hotrow .bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.hotrow .bar i { display: block; height: 100%; background: var(--warn); }
.hotrow small { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.northarrow { position: absolute; right: calc(var(--gr) + var(--mini-w) + 12px); bottom: calc(var(--gb) + 6px); width: 44px; height: 44px; pointer-events: none; z-index: 1; }
.pop.charpop { left: 50%; transform: translateX(-50%); top: calc(var(--gt) + 60px); width: min(300px, calc(100vw - 32px)); }
.charopt { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 12px; border: 1px solid var(--line); }
.charopt[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.charopt .fig { width: 34px; height: 44px; flex: none; }
.charopt b { display: block; font-size: 13.5px; font-weight: 600; }
.charopt small { display: block; color: var(--muted); font-size: 12px; }
.charopt .h { margin-left: auto; display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.charopt .h input { width: 58px; height: 30px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 0 6px; background: var(--surface); color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
.fade { position: absolute; inset: 0; background: var(--stage); opacity: 0; pointer-events: none; transition: opacity .17s ease; z-index: 2; }
.fade.on { opacity: 1; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; pointer-events: none; }
.loading span { background: var(--surface); padding: 8px 14px; border-radius: 999px; box-shadow: var(--shadow-sm); }

/* Top-left brand */
.brand { position: absolute; top: var(--gt); left: var(--gl); display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; }
.brand .mark { width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.brand b { display: block; font-size: 14px; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; }
.brand small { display: block; color: var(--muted); font-size: 12px; line-height: 1.3; }

/* Top-center view controls */
.tc { position: absolute; top: var(--gt); left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
.seg { display: inline-flex; padding: 4px; gap: 2px; }
.seg button { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 10px; font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.seg button:hover { color: var(--ink); background: var(--surface-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

/* Top-right */
.tr { position: absolute; top: var(--gt); right: var(--gr); display: flex; gap: 8px; align-items: stretch; }
.iconbar { display: inline-flex; padding: 4px; gap: 2px; }
.iconbtn { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--ink); }
.iconbtn:hover:not(:disabled) { background: var(--surface-2); }
.iconbtn:disabled { opacity: .3; cursor: default; }
.iconbtn[aria-pressed="true"] { background: var(--accent-weak); color: var(--accent); }
.card.iconbtn { width: 44px; height: 44px; }
.pill { display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 6px 14px; min-width: 168px; text-align: left; }
.pill .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.pill .lab { font-size: 11px; color: var(--muted); }
.pill b { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.pill .meter { height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
.pill .meter i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s; }
.pill.over b { color: var(--danger); }
.pill.over .meter i { background: var(--danger); }
.pill:hover { border-color: var(--line-strong); }

/* Tool rail */
.rail { position: absolute; left: var(--gl); top: calc(var(--gt) + 68px); width: var(--rail-w); display: flex; flex-direction: column; padding: 6px; gap: 2px; }
.tool { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 2px 7px; border-radius: 10px; font-size: 11px; font-weight: 500; color: var(--muted); }
.tool:hover { background: var(--surface-2); color: var(--ink); }
.tool[aria-pressed="true"] { background: var(--accent-weak); color: var(--accent); }
.rail hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }

/* Drawer */
.drawer { position: absolute; left: calc(var(--gl) + var(--rail-w) + 10px); top: calc(var(--gt) + 68px); bottom: var(--gb); width: var(--drawer-w); display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow); }
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 12px 10px 18px; }
.drawer-head h2 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.drawer-body > * { flex-shrink: 0; }
.drawer-body { flex: 1; overflow-y: auto; padding: 0 18px 18px; display: flex; flex-direction: column; gap: 18px; overscroll-behavior: contain; }
.sec { display: flex; flex-direction: column; gap: 8px; }
.eyebrow { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0; }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }
.note { font-size: 12.5px; border-radius: 10px; padding: 9px 11px; background: var(--surface-2); margin: 0; display: flex; gap: 8px; }
.note.bad { background: var(--danger-weak); }
.note svg { margin-top: 1px; }

.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 0 10px; background: var(--surface); }
.search input { border: 0; outline: 0; background: none; height: 38px; flex: 1; min-width: 0; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -18px; padding: 0 18px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-strong); font-size: 12.5px; font-weight: 500; color: var(--muted); }
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.icard { display: flex; flex-direction: column; text-align: left; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 8px 10px 10px; gap: 2px; min-width: 0; transition: border-color .12s, box-shadow .12s; }
.icard:hover { border-color: var(--accent); box-shadow: var(--shadow-sm); }
.icard .thumb { height: 74px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; margin-bottom: 6px; padding: 8px; }
.icard .thumb svg { width: 100%; height: 100%; }
.icard .nm { font-size: 13px; font-weight: 500; line-height: 1.25; }
.icard .mt { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.icard .tag { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }

.rows { display: flex; flex-direction: column; }
.rowbtn { display: flex; align-items: center; gap: 10px; padding: 9px 8px; margin: 0 -8px; border-radius: 10px; text-align: left; }
.rowbtn:hover { background: var(--surface-2); }
.rowbtn[aria-current="true"] { background: var(--accent-weak); }
.rowbtn .t { flex: 1; min-width: 0; }
.rowbtn .t b { display: block; font-weight: 500; font-size: 13.5px; }
.rowbtn .t small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rowbtn .v { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dot2 { width: 28px; height: 28px; border-radius: 8px; flex: none; position: relative; overflow: hidden; border: 1px solid var(--line-strong); }
.dot2 i { position: absolute; right: 0; bottom: 0; width: 50%; height: 50%; border-top-left-radius: 6px; border-left: 1px solid var(--line-strong); border-top: 1px solid var(--line-strong); }

.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; text-align: left; }
.opt:hover { border-color: var(--line-strong); }
.opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.opt .sw0 { width: 34px; height: 34px; border-radius: 8px; flex: none; border: 1px solid var(--line-strong); }
.opt .t { flex: 1; min-width: 0; font-size: 13px; font-weight: 500; }
.opt .t small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line-strong); }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
.sw.none { background: repeating-linear-gradient(45deg, var(--surface) 0 4px, var(--line-strong) 4px 5px); }
.sw.sq { border-radius: 9px; width: 44px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.ghost { border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }

/* switch */
.switch { position: relative; width: 38px; height: 22px; border-radius: 999px; background: var(--line-strong); flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--danger); }
.switch[aria-checked="true"]::after { transform: translateX(16px); }

/* budget */
.total { font-size: 30px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.total small { font-size: 13px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
.stack { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--surface-2); gap: 2px; }
.stack i { display: block; height: 100%; }
.glist details { border-bottom: 1px solid var(--line); }
.glist summary { display: flex; align-items: center; gap: 10px; padding: 10px 0; cursor: pointer; list-style: none; font-size: 13.5px; }
.glist summary::-webkit-details-marker { display: none; }
.glist .k { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.glist .amt { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 500; }
.glist .chev { color: var(--muted); transition: transform .15s; }
.glist details[open] .chev { transform: rotate(90deg); }
.lines { display: flex; flex-direction: column; gap: 6px; padding: 0 0 12px 20px; }
.line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 10px; font-size: 12.5px; }
.line .d { color: var(--muted); font-size: 11.5px; }
.line .a { font-variant-numeric: tabular-nums; text-align: right; grid-row: 1; grid-column: 2; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 13px; align-items: center; }
.kv .a { text-align: right; font-variant-numeric: tabular-nums; }
.kv .grand { font-weight: 600; font-size: 15px; padding-top: 8px; border-top: 1px solid var(--line); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 9px; }
.stepper button { width: 30px; height: 30px; display: grid; place-items: center; color: var(--muted); }
.stepper button:hover { color: var(--ink); }
.stepper output { min-width: 24px; text-align: center; font-variant-numeric: tabular-nums; font-size: 13px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
.input { height: 36px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--surface); padding: 0 10px; color: var(--ink); font-size: 13px; width: 100%; min-width: 0; font-variant-numeric: tabular-nums; }
.rates { display: grid; grid-template-columns: minmax(0, 1fr) 92px; gap: 6px 10px; align-items: center; font-size: 12.5px; padding-top: 8px; }
.rates h4 { grid-column: 1 / -1; margin: 10px 0 0; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.rates .input { height: 30px; text-align: right; }
details.more > summary { cursor: pointer; font-size: 13px; font-weight: 500; color: var(--accent); list-style: none; }
details.more > summary::-webkit-details-marker { display: none; }

/* Selection bar */
.bottom-zone { position: absolute; bottom: var(--gb); left: calc(var(--gl) + var(--rail-w) + 12px); right: calc(var(--gr) + var(--mini-w) + 12px); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }

.bottom-zone > * { pointer-events: auto; }
.selbar { display: flex; align-items: center; gap: 4px; padding: 6px; max-width: 100%; box-shadow: var(--shadow); flex-wrap: wrap; justify-content: center; }
.selbar .who { display: flex; align-items: center; gap: 10px; padding: 0 10px 0 4px; min-width: 0; }
.selbar .who .th { width: 40px; height: 40px; border-radius: 9px; background: var(--surface-2); display: grid; place-items: center; padding: 5px; flex: none; }
.selbar .who .th svg { width: 100%; height: 100%; }
.selbar .who b { display: block; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
.selbar .who small { display: block; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.selbar .sep { width: 1px; align-self: stretch; background: var(--line); margin: 4px 4px; }
.selbar .dims { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.selbar .dims label { display: flex; align-items: center; gap: 4px; }
.selbar .dims input { width: 72px; height: 32px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); padding: 0 8px; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink); }
.selbar .iconbtn { width: 38px; height: 38px; }
.selbar .iconbtn.danger { color: var(--danger); }
.flag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--danger); background: var(--danger-weak); border-radius: 999px; padding: 3px 9px; }
.flag.ok { color: var(--accent); background: var(--accent-weak); }
.flag.neutral { color: var(--muted); background: var(--surface-2); }
.minisw { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--line-strong); flex: none; }
.chipbtn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 10px; border-radius: 10px; font-size: 12.5px; }
.chipbtn:hover { background: var(--surface-2); }
.chipbtn small { display: block; color: var(--muted); font-size: 11px; line-height: 1.1; }
.chipbtn span { text-align: left; line-height: 1.2; }
.hintchip { display: flex; align-items: center; gap: 10px; background: color-mix(in srgb, var(--ink) 86%, transparent); color: var(--surface); padding: 7px 8px 7px 14px; border-radius: 999px; font-size: 12.5px; box-shadow: var(--shadow-sm); max-width: 100%; }
.hintchip button { color: inherit; opacity: .75; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.hintchip button:hover { opacity: 1; background: rgba(255,255,255,.12); }

/* Mini map / inset */
.mini { position: absolute; right: var(--gr); bottom: var(--gb); width: var(--mini-w); height: var(--mini-h); overflow: hidden; overflow: clip; box-shadow: var(--shadow); transition: width .2s, height .2s; }
.mini-head { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; justify-content: space-between; align-items: center; z-index: 2; pointer-events: none; }
.mini-head > * { pointer-events: auto; }
.mini-label { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; background: var(--surface); color: var(--muted); padding: 3px 8px; border-radius: 999px; box-shadow: var(--shadow-sm); }
.mini-head .iconbtn { width: 30px; height: 30px; background: var(--surface); box-shadow: var(--shadow-sm); border-radius: 8px; }
.view-mini { position: absolute; inset: 0; background: var(--paper); cursor: pointer; overflow: hidden; overflow: clip; }
.view-mini > svg, .view-mini > canvas { width: 100%; height: 100%; display: block; }
.view-mini > canvas { pointer-events: none; }
.mini.collapsed { width: 44px; height: 44px; }
.mini.collapsed .view-mini, .mini.collapsed .mini-label, .mini.collapsed #mini-swap { display: none; }
.mini.collapsed .mini-head { inset: 0; justify-content: center; }
.mini.collapsed #mini-toggle { width: 44px; height: 44px; box-shadow: none; }

.zoom { position: absolute; right: var(--gr); bottom: calc(var(--gb) + var(--mini-h) + 12px); display: flex; flex-direction: column; padding: 4px; gap: 2px; }
.app.mini-collapsed .zoom { bottom: calc(var(--gb) + 56px); }
.app.mini-collapsed .bottom-zone { right: calc(var(--gr) + 56px); }

/* Menu popover */
.menu { position: absolute; top: calc(var(--gt) + 56px); right: var(--gr); width: min(360px, calc(100vw - 32px)); max-height: calc(100% - 100px); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow); z-index: 20; }
.menu h3 { margin: 0; font-size: 15px; font-weight: 600; }
.saved .srow { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.saved .srow span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.saved .srow small { color: var(--muted); font-size: 11.5px; }
textarea { width: 100%; min-height: 72px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--surface); padding: 8px 10px; font: 12px var(--mono); resize: vertical; }

.toast { position: absolute; top: calc(var(--gt) + 64px); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 8px 14px; border-radius: 999px; font-size: 13px; z-index: 50; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }

/* ---- Plan (SVG) ---- */
#plan.measure { cursor: crosshair; }
#plan.panning { cursor: grabbing; }
.room { cursor: pointer; filter: var(--floor-filter); }
.room-sel { fill: var(--accent); fill-opacity: .1; stroke: var(--accent); stroke-width: 2.5px; vector-effect: non-scaling-stroke; pointer-events: none; }
.ledge { fill: url(#hatch); stroke: var(--muted); stroke-width: 1px; vector-effect: non-scaling-stroke; }
.wall rect { vector-effect: non-scaling-stroke; }
.wall.k-struct rect { fill: var(--struct); }
.wall.k-ext rect { fill: var(--wall-ext); }
.wall.k-part rect, .wall.k-wet rect { fill: var(--wall); cursor: pointer; }
.wall.k-wet rect { stroke: var(--wall-ext); stroke-width: .8px; stroke-dasharray: 3 2; }
.wall.k-struct rect, .wall.k-ext rect { cursor: pointer; }
.wall.k-part:hover rect, .wall.k-wet:hover rect { fill: var(--accent); }
.wall.removed rect { fill: transparent; stroke: var(--danger); stroke-width: 1.2px; stroke-dasharray: 5 4; }
.wall.removed:hover rect { fill: var(--danger-weak); }
.wall.sel rect { stroke: var(--accent); stroke-width: 2.5px; }
.wall.sel.removed rect { stroke: var(--danger); }
.win-glass { fill: var(--paper); stroke: var(--ink); stroke-width: .9px; vector-effect: non-scaling-stroke; }
.win-line { stroke: var(--ink); stroke-width: .7px; vector-effect: non-scaling-stroke; }
.door-leaf { stroke: var(--ink); stroke-width: 1.4px; fill: none; vector-effect: non-scaling-stroke; }
.door-arc { stroke: var(--muted); stroke-width: .9px; stroke-dasharray: 4 3; fill: none; vector-effect: non-scaling-stroke; }
.room-label { font: 600 220px var(--font); fill: var(--ink); text-anchor: middle; paint-order: stroke; stroke: var(--paper); stroke-width: 50px; stroke-linejoin: round; pointer-events: none; letter-spacing: 6px; }
.room-sub { font: 400 150px var(--mono); fill: var(--muted); text-anchor: middle; paint-order: stroke; stroke: var(--paper); stroke-width: 40px; pointer-events: none; }
.dim { stroke: var(--muted); stroke-width: .8px; vector-effect: non-scaling-stroke; fill: none; }
.dim-t { font: 400 170px var(--mono); fill: var(--muted); text-anchor: middle; }
.gridline { stroke: var(--grid); stroke-width: 1px; vector-effect: non-scaling-stroke; }
.item { cursor: grab; }
.item .hit { fill: transparent; }
.fl { fill: var(--furn); stroke: var(--furn-line); stroke-width: 1.2px; vector-effect: non-scaling-stroke; }
.fs { fill: var(--furn-soft); stroke: var(--furn-line); stroke-width: .8px; vector-effect: non-scaling-stroke; }
.fd { fill: none; stroke: var(--furn-line); stroke-width: .8px; vector-effect: non-scaling-stroke; }
.fdash { fill: none; stroke: var(--furn-line); stroke-width: 1px; stroke-dasharray: 5 3; vector-effect: non-scaling-stroke; }
.rugf { fill: var(--rug); stroke: var(--furn-line); stroke-width: .8px; vector-effect: non-scaling-stroke; opacity: .9; }
.item.built .fl { fill: var(--built); }
.el { fill: var(--paper); stroke: var(--elec); stroke-width: 1.4px; vector-effect: non-scaling-stroke; }
.el-l { fill: none; stroke: var(--elec); stroke-width: 1.2px; vector-effect: non-scaling-stroke; }
.el-f { fill: var(--elec); }
.el-d { fill: none; stroke: var(--elec); stroke-width: 1px; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
.item.warn .fl, .item.warn .fdash { stroke: var(--danger); }
.item-label { font-family: var(--font); font-weight: 500; fill: var(--ink); text-anchor: middle; pointer-events: none; }
.sel-box { fill: none; stroke: var(--accent); stroke-width: 1.5px; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke; pointer-events: none; }
.sel-box.warn { stroke: var(--danger); }
.handle { fill: var(--accent); stroke: var(--paper); stroke-width: 2px; vector-effect: non-scaling-stroke; cursor: nwse-resize; }
.handle.rot { cursor: pointer; }
.clr { stroke: var(--accent); stroke-width: 1px; vector-effect: non-scaling-stroke; }
.clr-t { font: 500 140px var(--mono); fill: var(--accent); text-anchor: middle; paint-order: stroke; stroke: var(--paper); stroke-width: 40px; }
.meas { stroke: var(--warn); stroke-width: 2px; vector-effect: non-scaling-stroke; }
.meas-t { font: 600 200px var(--mono); fill: var(--warn); text-anchor: middle; paint-order: stroke; stroke: var(--paper); stroke-width: 50px; }
.cam-wedge { fill: var(--accent); fill-opacity: .22; stroke: var(--accent); stroke-width: 1.2px; vector-effect: non-scaling-stroke; pointer-events: none; }
.cam-dot { fill: var(--accent); stroke: var(--paper); stroke-width: 2px; vector-effect: non-scaling-stroke; pointer-events: none; }
#plan.is-mini .room-label, #plan.is-mini .room-sub, #plan.is-mini #g-dims, #plan.is-mini #g-over, #plan.is-mini #g-grid { display: none; }
#plan.is-mini .item, #plan.is-mini .room, #plan.is-mini .wall rect { cursor: pointer; }
#plan.is-mini .wall.k-part:hover rect, #plan.is-mini .wall.k-wet:hover rect { fill: var(--wall); }

@media (max-width: 1560px) { .tc .seg button span { display: none; } .tc .seg button { padding: 0 10px; } }

}

}
.bchip .bt-short { display: none; }
@media (max-width: 760px), (max-height: 500px) { .bchip .bt-short { display: inline; } }
/* ---- Portrait phone ---- */
@media (max-width: 760px) {
  :root { --mini-w: 118px; --mini-h: 86px; --rail-w: 0px; }
  .tc { top: calc(var(--gt) + 54px); left: var(--gl); transform: none; flex-wrap: nowrap; }
  .mini { top: calc(var(--gt) + 54px); bottom: auto; }
  .where, .bchip { top: calc(var(--gt) + 150px); }
  .pop.roomlist2 { top: calc(var(--gt) + 194px); }
  .pop.charpop { top: calc(var(--gt) + 100px); }
  .pop.sunpop { top: calc(var(--gt) + 100px); right: var(--gl); left: var(--gl); width: auto; max-height: 60vh; }
  .northarrow { right: auto; left: var(--gl); bottom: auto; top: calc(var(--gt) + 104px); width: 38px; height: 38px; }
  .toast { top: calc(var(--gt) + 150px); }
  .rail { top: auto; bottom: var(--gb); left: var(--gl); right: var(--gr); width: auto; flex-direction: row; justify-content: space-around; padding: 4px; }

  .drawer::before { content: ""; position: absolute; top: 6px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: var(--line-strong); }

  :root { --mini-w: 184px; --mini-h: 124px; --rail-w: 52px; --drawer-w: 320px; --gt: calc(10px + env(safe-area-inset-top, 0px)); --gb: calc(10px + env(safe-area-inset-bottom, 0px)); }
  .tc { left: calc(var(--gl) + 54px); transform: none; }
  .rail { top: calc(var(--gt) + 52px); padding: 4px; }
  .rail hr { margin: 2px 4px; }

  .where, .bchip, .toast { top: calc(var(--gt) + 52px); }

}
/* tool badge */
.tico { position: relative; display: inline-flex; }
.tbadge { position: absolute; top: -6px; right: -10px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; line-height: 1; }
.tbadge.amber { background: var(--warn); }
/* checks */
.vrow { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.vrow .t { flex: 1; min-width: 0; }
.vrow .t b { display: block; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vrow .t small { display: block; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.vrow .iconbtn { width: 32px; height: 32px; }
.vrow .iconbtn.danger { color: var(--danger); width: auto; padding: 0 6px; }
.vic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); flex: none; }
.vic.named { background: var(--accent-weak); color: var(--accent); }
.issue { display: flex; gap: 10px; align-items: flex-start; padding: 9px 8px; margin: 0 -8px; border-radius: 10px; text-align: left; width: calc(100% + 16px); }
.issue:hover { background: var(--surface-2); }
.issue .dot3 { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--danger-weak); color: var(--danger); }
.issue.amber .dot3 { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.issue b { display: block; font-size: 13px; font-weight: 500; }
.issue small { display: block; color: var(--muted); font-size: 12px; }
.allclear { display: flex; gap: 10px; align-items: center; padding: 14px; border-radius: 12px; background: var(--accent-weak); color: var(--ink); font-size: 13px; }
.door-blocked { fill: var(--danger); fill-opacity: .16; stroke: none; pointer-events: none; }
.win-t { font: 600 150px var(--mono); fill: var(--muted); text-anchor: middle; pointer-events: none; }
.walk-gap { stroke: var(--warn); stroke-width: 2px; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
.walk-gap-t { font: 600 150px var(--mono); fill: var(--warn); text-anchor: middle; paint-order: stroke; stroke: var(--paper); stroke-width: 40px; }
.door-hit { stroke: transparent; stroke-width: 14px; vector-effect: non-scaling-stroke; fill: none; cursor: pointer; pointer-events: stroke; }
/* timeline */
.gantt { display: flex; flex-direction: column; gap: 10px; }
.grow b { display: block; font-size: 13px; font-weight: 500; }
.grow small { display: block; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.gtrack { position: relative; height: 10px; border-radius: 5px; background: var(--surface-2); background-image: repeating-linear-gradient(90deg, transparent 0 calc(var(--wk) - 1px), var(--line-strong) calc(var(--wk) - 1px) var(--wk)); margin-top: 5px; }
.gtrack i { position: absolute; top: 0; bottom: 0; border-radius: 5px; min-width: 4px; }
.gtrack i.off { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.45) 0 4px, transparent 4px 8px) !important; }
.pay { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.pay td { padding: 6px 0; border-bottom: 1px solid var(--line); }
.pay td.n { text-align: right; font-variant-numeric: tabular-nums; }
/* custom item form */

.cdims { display: none; gap: 10px; }
.colchip { width: 18px; height: 18px; border-radius: 5px; border: 1px solid var(--line-strong); }
.selbar.expanded { flex-wrap: wrap; }
/* brand as design switcher */

.pop { position: absolute; top: calc(var(--gt) + 64px); left: var(--gl); width: min(380px, calc(100vw - 32px)); max-height: calc(100% - 110px); overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); z-index: 20; }

.drow { display: flex; align-items: center; gap: 10px; padding: 8px; margin: 0 -6px; border-radius: 10px; }

.drow .t { flex: 1; min-width: 0; text-align: left; }
.drow .t b { display: block; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.drow .t small { display: block; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.drow .letter { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--surface-2); flex: none; }

.cmp { overflow-x: auto; margin: 0 -18px; padding: 0 18px; }

.cmp .best { color: var(--accent); }
/* before / after */
.ba button { padding: 0 11px; }
.bchip { position: absolute; top: calc(var(--gt) + 60px); left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 14px; font-size: 13px; background: var(--ink); color: var(--surface); border-color: var(--ink); z-index: 3; }
.bchip .btn { height: 30px; color: var(--ink); background: var(--surface); border-color: var(--surface); }

.joy { position: absolute; left: calc(var(--gl) + var(--rail-w) + 16px); bottom: var(--gb); width: 124px; height: 124px; border-radius: 50%; background: color-mix(in srgb, var(--surface) 72%, transparent); border: 1px solid var(--line-strong); box-shadow: var(--shadow-sm); touch-action: none; z-index: 4; }
.jumpbtn { position: absolute; right: var(--gr); bottom: calc(var(--gb) + 24px); width: 72px; height: 72px; border-radius: 50%; font-weight: 600; font-size: 13px; z-index: 4; box-shadow: var(--shadow); }
.jumpbtn:active { transform: scale(.94); }
.app.walking .zoom { display: flex !important; }
.joy i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: var(--ink); opacity: .85; }
/* export pack */
#export { position: fixed; inset: 0; z-index: 60; overflow: auto; background: #dfe3df; color: #17201c; color-scheme: light;
  --paper: #ffffff; --ink: #17201c; --muted: #5f6a64; --line: #e2e6e1; --line-strong: #cfd5ce; --surface: #ffffff; --surface-2: #f3f5f2; --accent: #0f6e5e;
  --struct: #1b1f1d; --wall-ext: #5b645f; --wall: #a2aaa4; --furn: #ffffff; --furn-soft: #eef1ec; --furn-line: #2f3a35; --built: #e3eee8; --rug: #e9e2d4; --elec: #c2410c; --danger: #b42318; --floor-filter: none; }
.xbar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px max(16px, env(safe-area-inset-left, 0px)); background: #17201c; color: #fff; }
.xbar b { margin-right: auto; font-size: 14px; }
.xbar .btn { background: #fff; color: #17201c; border-color: #fff; }
.xbar .btn.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.35); }
.xbar small { flex-basis: 100%; color: rgba(255,255,255,.7); font-size: 12px; }
.pages { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 24px 16px 60px; }
.page { width: min(1123px, 100%); min-height: calc(min(1123px, 100vw - 32px) * 0.707); background: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.12); padding: 36px 40px; display: flex; flex-direction: column; gap: 16px; }
.page header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; border-bottom: 2px solid #17201c; padding-bottom: 10px; }
.page header h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
.page header p { margin: 2px 0 0; color: #5f6a64; font-size: 13px; }
.page header .tot { text-align: right; font-size: 12px; color: #5f6a64; }
.page header .tot b { display: block; font-size: 20px; color: #17201c; font-variant-numeric: tabular-nums; }
.page h2 { margin: 0; font-size: 14px; text-transform: uppercase; letter-spacing: .07em; color: #0f6e5e; }
.page .plan svg { width: 100%; height: auto; display: block; }
.page .shots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.page .shots figure { margin: 0; }
.page .shots img { width: 100%; border-radius: 6px; display: block; background: #eef0ec; aspect-ratio: 16 / 10; object-fit: cover; }
.page .shots figcaption { font-size: 12px; color: #5f6a64; margin-top: 4px; }
.page table { width: 100%; border-collapse: collapse; font-size: 12px; }
.page th, .page td { text-align: left; padding: 5px 6px; border-bottom: 1px solid #e2e6e1; vertical-align: top; }
.page th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #5f6a64; font-weight: 600; }
.page td.n, .page th.n { text-align: right; font-variant-numeric: tabular-nums; }
.page tr.g td { font-weight: 600; background: #f3f5f2; }
.page tr.t td { font-weight: 700; font-size: 13px; border-top: 2px solid #17201c; }
.page .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.page .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 11.5px; color: #5f6a64; }
.page .legend i { display: inline-block; width: 14px; height: 8px; margin-right: 5px; vertical-align: middle; border-radius: 2px; }
.page .fine { font-size: 11px; color: #5f6a64; margin-top: auto; }
@media (max-width: 760px) { .jumpbtn { bottom: calc(var(--gb) + 140px); } .app.walking .zoom { bottom: calc(var(--gb) + 224px); right: var(--gr); top: auto; } .page { padding: 20px; } .page .shots, .page .cols { grid-template-columns: 1fr; } .joy { left: var(--gl); bottom: calc(var(--gb) + 132px); } }
@media print {
  @page { size: A4 landscape; margin: 8mm; }
  html, body { height: auto; overflow: visible !important; background: #fff; }
  .app, .toast { display: none !important; }
  #export { position: static; overflow: visible; background: #fff; }
  .xbar { display: none; }
  .pages { padding: 0; gap: 0; }
  .page { width: 100%; min-height: 0; box-shadow: none; padding: 0; break-after: page; page-break-after: always; }
}

}

/* Finishes */

  else if (r.shelter) note = `<p class="note bad"><svg class="ic sm"><use href="#i-alert"/></svg><span>Don’t hack or drill into the household shelter’s walls, floor or ceiling.</span></p>`;
  else if (r.id === 'kit') note = `<p class="note"><svg class="ic sm"><use href="#i-info"/></svg><span>Kitchen tiles follow the same 3-year rule as bathrooms. Overlay is fine.</span></p>`;

    ${note}
    <div class="sec"><p class="eyebrow">Flooring · ${esc(r.name)}</p><div class="opts">${allowed.map(([k, v]) => { const c = k === 'asis' ? patSpec(r, { floor: 'asis' }).c[0] : Object.values(v.tones)[0].c[0]; return `<button class="opt" data-floor="${k}" aria-pressed="${st.floor === k}"><span class="sw0" style="background:${c}"></span><span class="t">${esc(v.name)}<small>${k === 'asis' ? 'Keep the existing floor' : Object.keys(v.tones).length + ' tones'}</small></span></button>`; }).join('')}</div>

/* Walls */

    <div class="sec"><p class="eyebrow">Removable walls${removed.length ? ` · ${removed.length} marked` : ''}</p><div class="rows">${rem.map(w => { const on = !!(S.walls[w.id] && S.walls[w.id].removed); return `<div class="rowbtn" aria-current="${UI.sel && UI.sel.id === w.id}" data-wsel="${w.id}" style="cursor:pointer">

    <p class="note"><svg class="ic sm"><use href="#i-info"/></svg><span>Hacking non-structural walls needs an HDB renovation permit, which your contractor applies for. Bathroom walls also need fresh waterproofing, and can’t be hacked in the first 3 years.</span></p>`;
}

/* Versions & history */
function relTime(t) { const m = Math.round((Date.now() - t) / 60000); if (m < 1) return 'just now'; if (m < 60) return `${m} min ago`; const h = Math.round(m / 60); if (h < 24) return `${h} h ago`; return new Date(t).toLocaleString('en-SG', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }); }

      <button class="iconbtn" data-vrename="${x.id}" title="${x.auto ? 'Keep as a named version' : 'Rename'}" aria-label="Rename"><svg class="ic sm"><use href="#i-tag"/></svg></button>
      <button class="iconbtn${UI.vDel === x.id ? ' danger' : ''}" data-vdel="${x.id}" title="Delete" aria-label="${UI.vDel === x.id ? 'Confirm delete' : 'Delete'}">${UI.vDel === x.id ? '<b style="font-size:11px">Sure?</b>' : '<svg class="ic sm"><use href="#i-trash"/></svg>'}</button>`}</div>`; };
  const named = list.filter(x => !x.auto), autos = list.filter(x => x.auto);
  return `<form class="sec" id="v-form"><label class="field">Save the current state of ${esc(dn)}<span style="display:flex;gap:8px"><input class="input" id="v-new" maxlength="40" placeholder="e.g. Before meeting the ID"><button class="btn primary" type="submit">Save</button></span></label></form>
    <div class="sec"><p class="eyebrow">Base</p><div class="vrow"><span class="vic named"><svg class="ic sm"><use href="#i-home"/></svg></span><span class="t"><b>Bare house</b><small>As handed over · no furniture · always available</small></span><button class="btn sm${UI.vBare ? ' danger' : ''}" data-vbare="1">${UI.vBare ? 'Reset now?' : 'Reset to this'}</button></div></div>
    <div class="sec"><p class="eyebrow">Saved versions${named.length ? ' · ' + named.length : ''}</p>${named.length ? named.map(row).join('') : '<p class="hint">None yet. Save one before trying a big change.</p>'}</div>
    <div class="sec"><p class="eyebrow">Automatic history${autos.length ? ' · ' + autos.length : ''}</p>${autos.length ? autos.map(row).join('') : '<p class="hint">Snapshots appear here every few minutes while you work, and before restores and resets.</p>'}</div>
    <p class="hint">History is kept for each design option on this device. Restoring saves the current state first, so nothing is lost.</p>`;
}
function findVer(id) { const v = readVers(), list = v[dsId()] || []; return { v, list, x: list.find(y => y.id === id) }; }
body.addEventListener('submit', e => { if (e.target.id !== 'v-form') return; e.preventDefault(); const n = ($('#v-new').value || '').trim() || 'Version ' + new Date().toLocaleString('en-SG', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }); if (UI.before) setBefore(false); persist(); toast(addVersion(n, false) !== false ? `Saved “${n}”` : 'Couldn’t save: this browser’s storage is full. Delete some versions.'); renderDrawer(); });
body.addEventListener('click', e => {
  const bb = e.target.closest('[data-vbare]');
  if (bb) { if (!UI.vBare) { UI.vBare = true; return renderDrawer(); } UI.vBare = false; setBefore(false); addVersion('Before reset to bare house', true); lastAuto = Date.now(); mutate(() => { S = bareHouse(); UI.sel = null; }); toast('Reset to bare house. Undo is available.'); return renderDrawer(); }
  const b = e.target.closest('[data-vrestore],[data-vrename],[data-vsave],[data-vdel]'); if (!b) return;
  if (b.dataset.vrestore) { const { x } = findVer(b.dataset.vrestore); if (!x) return; setBefore(false); addVersion('Before restoring “' + (x.name || 'auto-save') + '”', true); lastAuto = Date.now(); mutate(() => { S = normalize(JSON.parse(JSON.stringify(x.s))); UI.sel = null; }); toast(`Restored ${x.name ? '“' + x.name + '”' : 'the ' + relTime(x.t) + ' snapshot'}. Undo is available.`); return renderDrawer(); }
  if (b.dataset.vrename) { UI.vRename = b.dataset.vrename; UI.vDel = null; renderDrawer(); const i = $('#v-name'); if (i) { i.focus(); i.select(); } return; }
  if (b.dataset.vsave) { const { v, x } = findVer(b.dataset.vsave); if (x) { x.name = ($('#v-name').value || '').trim() || x.name || 'Saved version'; x.auto = false; writeVers(v); } UI.vRename = null; return renderDrawer(); }
  if (b.dataset.vdel) { if (UI.vDel !== b.dataset.vdel) { UI.vDel = b.dataset.vdel; return renderDrawer(); } const { v, list, x } = findVer(b.dataset.vdel); if (x) { list.splice(list.indexOf(x), 1); writeVers(v); } UI.vDel = null; toast('Version deleted'); return renderDrawer(); }

body.addEventListener('keydown', e => { if (e.target.id === 'v-name' && e.key === 'Enter') { e.preventDefault(); const b = body.querySelector('[data-vsave]'); if (b) b.click(); } });

/* Checks */
function allIssues() {
  const bad = conflicts(), byId = id => S.items.find(i => i.id === id), name = it => it ? (it.label || CAT[it.type].name) : 'wall';
  const doors = [], overlaps = [];
  bad.forEach((msg, id) => { const it = byId(id); (msg.startsWith('Blocks') ? doors : overlaps).push({ id, title: `${name(it)} ${msg.charAt(0).toLowerCase() + msg.slice(1)}`, sub: msg.startsWith('Blocks') ? 'The door can’t swing open fully' : 'Two things are in the same spot' }); });
  const walks = walkways().map(w => ({ id: w.a, title: `${w.gap} mm between ${name(byId(w.a))} and ${w.b ? name(byId(w.b)) : 'the wall'}`, sub: w.gap < 450 ? 'Too narrow to walk through. Aim for 600 mm or more' : 'Tight for walking. Aim for 600 mm, or 900 mm in front of wardrobes and counters' }));
  return { doors, overlaps, walks, red: doors.length + overlaps.length, amber: walks.length };
}
function checksHTML() {
  const c = allIssues(), row = (it, amber) => `<button class="issue${amber ? ' amber' : ''}" data-goitem="${it.id}"><span class="dot3"><svg class="ic sm"><use href="#i-alert"/></svg></span><span><b>${esc(it.title)}</b><small>${esc(it.sub)}</small></span></button>`;
  if (!c.red && !c.amber) return `<div class="allclear"><svg class="ic"><use href="#i-check"/></svg><span><b>All clear.</b> Every door opens fully, nothing overlaps, and walkways are at least 600 mm.</span></div>${checksNote()}`;
  return `${c.doors.length ? `<div class="sec"><p class="eyebrow">Doors that can’t open · ${c.doors.length}</p>${c.doors.map(x => row(x)).join('')}</div>` : ''}
    ${c.overlaps.length ? `<div class="sec"><p class="eyebrow">Overlapping · ${c.overlaps.length}</p>${c.overlaps.map(x => row(x)).join('')}</div>` : ''}
    ${c.walks.length ? `<div class="sec"><p class="eyebrow">Tight walkways · ${c.walks.length}</p>${c.walks.map(x => row(x, true)).join('')}</div>` : ''}
    ${checksNote()}`;
}
function checksNote() { return `<p class="hint">Tap an issue to select the item. Blocked door swings show in red on the plan, and tight gaps show as orange lines while this panel is open. Tap a door to open or close it.</p>`; }
function renderBadge() {
  const c = allIssues(), n = c.red + c.amber, b = $('#checks-badge');
  b.hidden = !n; b.textContent = n > 9 ? '9+' : n; b.classList.toggle('amber', !c.red);
}



body.addEventListener('click', e => {
  const b = e.target.closest('button, [data-wsel]'); if (!b) return;
  const r = UI.finRoom;
  if (b.dataset.cat) { UI.cat = b.dataset.cat; return renderCatalogue(); }
  if (b.dataset.add) return addItem(b.dataset.add);
  if (b.dataset.owncol) { body.querySelectorAll('[data-owncol]').forEach(x => x.setAttribute('aria-pressed', x === b)); return; }
  if (b.dataset.addmine) { const m = myItems()[+b.dataset.addmine]; if (m) addCustom(m); return; }
  if (b.dataset.delmine) { const a = myItems(); a.splice(+b.dataset.delmine, 1); ls.set(KEY_MY, JSON.stringify(a)); renderCatalogue(); return; }
  if (b.dataset.fr) { UI.finRoom = b.dataset.fr; UI.sel = { kind: 'room', id: b.dataset.fr }; return select(UI.sel); }
  if (b.dataset.floor) return mutate(() => { const st = S.rooms[r]; st.floor = b.dataset.floor; const tones = Object.keys(FLOORS[st.floor].tones); if (!tones.includes(st.tone)) st.tone = tones[0]; });
  if (b.dataset.tone) return mutate(() => { S.rooms[r].tone = b.dataset.tone; });
  if (b.dataset.paint) return mutate(() => { S.rooms[r].paint = b.dataset.paint; });
  if (b.dataset.ceil) return mutate(() => { S.rooms[r].ceil = b.dataset.ceil; });
  if (b.dataset.apply) { const src = S.rooms[r]; const ids = $('#dry-ids').value.split(','); mutate(() => ids.forEach(id => { S.rooms[id].floor = src.floor; S.rooms[id].tone = src.tone; })); return toast(`${FLOORS[src.floor].name} applied to ${ids.length} rooms`); }
  if (b.dataset.wt) { e.stopPropagation(); return toggleWall(b.dataset.wt); }
  if (b.dataset.wsel) return select({ kind: 'wall', id: b.dataset.wsel });
  if (b.dataset.goitem) { const id = b.dataset.goitem; if (S.items.find(i => i.id === id)) select({ kind: 'item', id }); return; }
  if (b.dataset.ex) return mutate(() => { S.extras[b.dataset.ex] = Math.max(0, (S.extras[b.dataset.ex] || 0) + +b.dataset.dx); });
  if (b.id === 'rates-reset') { mutate(() => { S.rates = { ...DEFAULT_RATES }; }); toast('Rates reset'); }
});
body.addEventListener('submit', e => {
  if (e.target.id !== 'own-form') return; e.preventDefault();
  const v = id => $('#' + id).value.trim(), err = $('#own-err');
  const m = { label: v('own-name'), w: Math.round(+v('own-w')), d: Math.round(+v('own-d')), h: Math.round(+v('own-h') || 800), price: 0, col: (body.querySelector('[data-owncol][aria-pressed="true"]') || {}).dataset?.owncol || '#c9b79c' };
  const bad = !m.label ? 'Give the item a name.' : !(m.w >= 50 && m.w <= 8000) ? 'Enter a width between 50 and 8,000 mm.' : !(m.d >= 50 && m.d <= 8000) ? 'Enter a depth between 50 and 8,000 mm.' : !(m.h >= 10 && m.h <= 2600) ? 'Enter a height up to 2,600 mm.' : '';
  if (bad) { err.textContent = bad; err.hidden = false; return; }
  err.hidden = true; const a = myItems(); a.unshift(m); ls.set(KEY_MY, JSON.stringify(a.slice(0, 40)));
  e.target.reset(); addCustom(m); renderCatalogue();
});
body.addEventListener('toggle', e => { if (e.target.id === 'add-own') UI.addOpen = e.target.open; }, true);
body.addEventListener('input', e => { if (e.target.id === 'cat-q') { UI.q = e.target.value; renderCatalogue(); } });
body.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'f-budget') return mutate(() => { S.budget = Math.max(0, +t.value || 0); });
  if (t.id === 'f-cont') return mutate(() => { S.contingency = Math.min(50, Math.max(0, +t.value || 0)); });
  if (t.id === 'f-gst') return mutate(() => { S.gst = t.checked; });
  if (t.dataset.rate) return mutate(() => { S.rates[t.dataset.rate] = Math.max(0, +t.value || 0); });
});
body.addEventListener('dragstart', e => { const b = e.target.closest('[data-add]'); if (b) { e.dataTransfer.setData('text/plain', b.dataset.add); e.dataTransfer.effectAllowed = 'copy'; } });

/* ---------------- Keyboard ---------------- */
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, select')) return;
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (mod && k === 'd') { e.preventDefault(); dupSel(); return; }
  if (mod) return;
  if (UI.main === '3d' && UI.cam === 'walk' && ['w', 'a', 's', 'd', 'q', 'e', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) { e.preventDefault(); keys.add(k); requestRender(); return; }
  if (UI.main === '3d' && UI.cam === 'walk' && k === ' ') { e.preventDefault(); jump(); return; }
  const step = e.shiftKey ? 100 : 10;
  switch (k) {
    case 'delete': case 'backspace': if (selItem()) { e.preventDefault(); deleteSel(); } break;
    case 'r': rotateSel(e.shiftKey ? -90 : 90); break;
    case 'm': openTool('measure'); break;
    case 'b': setBefore(!UI.before); break;
    case 'tab': if (V3.ready) { e.preventDefault(); setMain(UI.main === '3d' ? '2d' : '3d'); } break;
    case 'escape':
      if (!$('#share-pop').hidden) { $('#share-pop').hidden = true; }
      else if (UI.charOpen) { UI.charOpen = false; renderCharPop(); renderTC(); }
      else if (!$('#export').hidden) { $('#export').hidden = true; $('#export').innerHTML = ''; }
      else if (dsUI.open) { dsUI.open = false; renderDesigns(); }
      else if (UI.menu) { UI.menu = null; renderMenu(); }
      else if (UI.tool === 'measure') closeTool();
      else if (UI.sel) select(null);
      else if (UI.tool) closeTool();
      else if (UI.cam === 'walk') camOrbit();
      break;
    case 'arrowleft': if (selItem()) { e.preventDefault(); nudge(-step, 0); } break;
    case 'arrowright': if (selItem()) { e.preventDefault(); nudge(step, 0); } break;
    case 'arrowup': if (selItem()) { e.preventDefault(); nudge(0, -step); } break;
    case 'arrowdown': if (selItem()) { e.preventDefault(); nudge(0, step); } break;
  }
});
document.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
window.addEventListener('blur', () => keys.clear());

(() => {
  const joy = $('#joy'), knob = $('#joy-knob'); let pid = null;
  const move = e => { const r = joy.getBoundingClientRect(); let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2); const L = Math.hypot(dx, dy), M = 40; if (L > M) { dx *= M / L; dy *= M / L; } JOY.x = dx / M; JOY.y = dy / M; knob.style.transform = `translate(${dx}px, ${dy}px)`; requestRender(); };
  joy.addEventListener('pointerdown', e => { pid = e.pointerId; joy.setPointerCapture(pid); JOY.on = true; move(e); });
  joy.addEventListener('pointermove', e => { if (e.pointerId === pid) move(e); });
  const end = e => { if (e.pointerId !== pid) return; pid = null; JOY.on = false; JOY.x = JOY.y = 0; knob.style.transform = ''; };
  joy.addEventListener('pointerup', end); joy.addEventListener('pointercancel', end);
})();
